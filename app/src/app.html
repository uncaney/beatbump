<!DOCTYPE html>
<html
	lang="fr"
	class=""
>
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0,user-scalable=0"
		/>
		<link
			rel="icon"
			href="/favicon.ico"
			sizes="48x48"
		/>
		<link
			rel="icon"
			type="image/svg+xml"
			href="/logo.svg"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="/assets/favicon-32x32.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="16x16"
			href="/assets/favicon-16x16.png"
		/>
		<link
			rel="shortcut icon"
			href="/favicon.ico"
		/>

		<meta
			name="application-name"
			content="Musique"
		/>
		<meta
			name="msapplication-TileColor"
			content="#da532c"
		/>

		<meta
			name="og:site_name"
			content="Musique"
		/>

		<!-- Apple Metatags-->
		<meta
			name="mobile-web-app-capable"
			content="yes"
		/>
		<meta
			name="apple-mobile-web-app-capable"
			content="yes"
		/>
		<meta
			content="yes"
			name="apple-touch-fullscreen"
		/>
		<meta
			name="apple-mobile-web-app-title"
			content="Musique"
		/>
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="/apple-touch-icon.png"
		/>
		<link
			rel="mask-icon"
			href="/assets/safari-pinned-tab.svg"
			color="#5bbad5"
		/>
		<meta
			name="theme-color"
			content="#17171d"
		/>
		<meta
			name="color-scheme"
			content="dark"
		/>
		<meta
			name="apple-mobile-web-app-orientations"
			content="portrait"
		/>
		<meta
			name="apple-mobile-web-app-status-bar-style"
			content="black"
		/>

		<!-- SvelteKit tags -->
		<link
			rel="manifest"
			href="/manifest.json"
		/>

		<script>
			var parcelRequire;

			// if (!("appearance" in localStorage)) {
			// 	localStorage.theme = "Dark";
			// }
			const hasSettings = localStorage.settings;
			if (!hasSettings) document.documentElement.classList.add("Dark");
			else
				document.documentElement.classList.add(
					JSON.parse(hasSettings)?.appearance?.Theme ?? "Dark",
				);
		</script>
		%sveltekit.head%
		<!-- Optional page-view analytics (an Umami-compatible script): OFF unless the build sets
		     PUBLIC_ANALYTICS_SRC and PUBLIC_ANALYTICS_WEBSITE_ID (Dockerfile build args, PUBLIC_ANALYTICS_HOST
		     optional). Added once the page has loaded: a <script defer src> in the head held the load event
		     until the analytics host answered, so an unreachable host froze the page load of every install. -->
		<script data-analytics-loader>
			(function () {
				var src = "%sveltekit.env.PUBLIC_ANALYTICS_SRC%";
				var id = "%sveltekit.env.PUBLIC_ANALYTICS_WEBSITE_ID%";
				var host = "%sveltekit.env.PUBLIC_ANALYTICS_HOST%";
				if (!/^https?:\/\//.test(src) || !id) return;
				function add() {
					var s = document.createElement("script");
					s.defer = true;
					s.src = src;
					s.setAttribute("data-website-id", id);
					if (host) s.setAttribute("data-host-url", host);
					document.head.appendChild(s);
				}
				if (document.readyState === "complete") add();
				else window.addEventListener("load", add, { once: true });
			})();
		</script>
	</head>
	<div id="app">%sveltekit.body%</div>
</html>
